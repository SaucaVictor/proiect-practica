<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wemos Control Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Firebase SDK (CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbmX_Fvm1b6vZ78MYS-ad5ZsxG7-G0MCc",
      authDomain: "classroom-tutu.firebaseapp.com",
      projectId: "classroom-tutu",
      storageBucket: "classroom-tutu.firebasestorage.app",
      messagingSenderId: "310581180946",
      appId: "1:310581180946:web:211a4b7887f6f452acb6cb",
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    // ── Real-time sensor listener ─────────────────────────────────────────────
    onSnapshot(collection(db, "sensors"), (snap) => {
      const grid = document.getElementById("sensor-grid");
      const empty = document.getElementById("sensor-empty");

      if (snap.empty) {
        empty.style.display = "flex";
        grid.innerHTML = "";
        return;
      }
      empty.style.display = "none";

      snap.docChanges().forEach(change => {
        const id = change.doc.id;
        const data = change.doc.data();
        let card = document.getElementById(`sensor-${id}`);

        if (change.type === "removed") {
          card?.remove();
          return;
        }

        const ts = data.lastUpdated?.toDate?.()?.toLocaleTimeString() ?? "–";
        const val = data.latestValue ?? "–";
        const ip  = data.deviceIp ?? "–";

        if (!card) {
          card = document.createElement("div");
          card.className = "sensor-card";
          card.id = `sensor-${id}`;
          grid.appendChild(card);
          requestAnimationFrame(() => card.classList.add("visible"));
        } else {
          card.classList.add("pulse");
          setTimeout(() => card.classList.remove("pulse"), 600);
        }

        card.innerHTML = `
          <div class="sensor-name">${id}</div>
          <div class="sensor-value">${val}</div>
          <div class="sensor-meta">
            <span class="sensor-ip">${ip}</span>
            <span class="sensor-time">${ts}</span>
          </div>
        `;
      });
    });

    // ── Poll device status ────────────────────────────────────────────────────
    async function pollDevice() {
      try {
        const r = await fetch("/api/device");
        const { device } = await r.json();
        const dot  = document.getElementById("status-dot");
        const text = document.getElementById("status-text");
        const ip   = document.getElementById("device-ip");
        if (device) {
          dot.classList.add("online");
          text.textContent = "Connected";
          ip.textContent = `${device.address}:${device.port}`;
        } else {
          dot.classList.remove("online");
          text.textContent = "Waiting for Wemos…";
          ip.textContent = "–";
        }
      } catch { /* server not ready yet */ }
    }
    pollDevice();
    setInterval(pollDevice, 3000);

    // ── Send message ──────────────────────────────────────────────────────────
    window.sendMessage = async (msg) => {
      const input = document.getElementById("cmd-input");
      const toast = document.getElementById("toast");
      const message = msg ?? input.value.trim();
      if (!message) return;

      try {
        const r = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await r.json();
        if (data.ok) {
          showToast(`✅ Sent: ${message}`, "success");
          if (!msg) input.value = "";
        } else {
          showToast(`⚠️ ${data.error}`, "error");
        }
      } catch (e) {
        showToast("❌ Server unreachable", "error");
      }
    };

    function showToast(msg, type) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // Enter key on input
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("cmd-input").addEventListener("keydown", e => {
        if (e.key === "Enter") window.sendMessage();
      });
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --bg2:       #13161f;
      --bg3:       #1a1e2a;
      --border:    rgba(255,255,255,0.07);
      --accent:    #6366f1;
      --accent2:   #818cf8;
      --green:     #22c55e;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    14px;
      --glow:      0 0 30px rgba(99,102,241,0.15);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 24px;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }

    .logo h1 { font-size: 1.3rem; font-weight: 700; }
    .logo p  { font-size: 0.75rem; color: var(--muted); }

    /* ── Device status ───────────────────────────────────────────────────── */
    .device-badge {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 16px;
      font-size: 0.85rem;
    }
    #status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    #status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    #device-ip { font-family: 'JetBrains Mono', monospace; color: var(--accent2); font-size: 0.78rem; }

    /* ── Sections ────────────────────────────────────────────────────────── */
    .section { margin-bottom: 36px; }
    .section-label {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Presets ─────────────────────────────────────────────────────────── */
    .presets { display: flex; flex-wrap: wrap; gap: 10px; }
    .preset-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg3); color: var(--text);
      font-size: 0.875rem; font-weight: 500; cursor: pointer;
      transition: all 0.18s ease;
    }
    .preset-btn:hover { transform: translateY(-2px); box-shadow: var(--glow); border-color: var(--accent); }
    .preset-btn:active { transform: translateY(0); }
    .preset-btn .icon { font-size: 1rem; }
    .preset-btn.on  { background: rgba(34,197,94,0.12);  border-color: rgba(34,197,94,0.4); }
    .preset-btn.off { background: rgba(239,68,68,0.10);  border-color: rgba(239,68,68,0.35); }

    /* ── Custom command ──────────────────────────────────────────────────── */
    .cmd-row { display: flex; gap: 10px; }
    .cmd-row input {
      flex: 1; padding: 12px 16px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 0.875rem;
      outline: none; transition: border-color 0.2s;
    }
    .cmd-row input:focus { border-color: var(--accent); }
    .cmd-row input::placeholder { color: var(--muted); }
    .send-btn {
      padding: 12px 22px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      color: #fff; font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: all 0.18s; white-space: nowrap;
    }
    .send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
    .send-btn:active { transform: translateY(0); }

    /* ── Sensor grid ─────────────────────────────────────────────────────── */
    #sensor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .sensor-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.35s, transform 0.35s, box-shadow 0.2s, border-color 0.2s;
    }
    .sensor-card.visible { opacity: 1; transform: translateY(0); }
    .sensor-card:hover { border-color: rgba(99,102,241,0.4); box-shadow: var(--glow); }
    .sensor-card.pulse { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .sensor-name {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .sensor-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem; font-weight: 500;
      color: var(--accent2);
      line-height: 1;
      margin-bottom: 12px;
    }
    .sensor-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.7rem; color: var(--muted);
    }
    .sensor-ip { font-family: 'JetBrains Mono', monospace; }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    #sensor-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 24px; gap: 12px;
      color: var(--muted); font-size: 0.9rem;
      border: 1px dashed var(--border); border-radius: var(--radius);
    }
    #sensor-empty .big { font-size: 2.5rem; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); padding: 12px 22px; border-radius: 100px;
      font-size: 0.875rem; font-weight: 500; pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s;
      opacity: 0; z-index: 100;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(34,197,94,0.5); color: var(--green); }
    .toast.error   { border-color: rgba(239,68,68,0.5);  color: var(--red); }

    /* ── Divider ─────────────────────────────────────────────────────────── */
    hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="device-badge">
      <div id="status-dot"></div>
      <span id="status-text">Waiting for Wemos…</span>
      <span id="device-ip">–</span>
    </div>
  </header>

  <!-- Quick Commands -->
  <div class="section">
    <div class="section-label">Quick Commands</div>
    <div class="presets">
      <button class="preset-btn on"  onclick="sendMessage('CMD;26:1')">  <span class="icon">Fan ON</span>  </button>
      <button class="preset-btn off" onclick="sendMessage('CMD;26:0')">  <span class="icon">Fan OFF</span> </button>
      <button class="preset-btn on"  onclick="sendMessage('CMD;25:1')">  <span class="icon">LED ON</span>  </button>
      <button class="preset-btn off" onclick="sendMessage('CMD;25:0')">  <span class="icon">LED OFF</span> </button>
      <button class="preset-btn"     onclick="sendMessage('CMD;PING')"> <span class="icon">Ping</span>    </button>
      <button class="preset-btn"     onclick="sendMessage('CMD;RESET')"><span class="icon">Reset</span>   </button>
    </div>
  </div>

  <!-- Custom command -->
  <div class="section">
    <div class="section-label">Custom Command</div>
    <div class="cmd-row">
      <input id="cmd-input" type="text" placeholder="e.g. CMD;26:1;25:0" spellcheck="false" autocomplete="off" />
      <button class="send-btn" onclick="sendMessage()">Send ↗</button>
    </div>
  </div>

  <hr />

  <!-- Sensor readings -->
  <div class="section">
    <div class="section-label">Live Sensor Readings</div>
    <div id="sensor-grid"></div>
    <div id="sensor-empty" style="display:flex">
      <span class="big">📭</span>
      <span>No sensor data yet — waiting for Wemos messages…</span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

</body>
</html>
